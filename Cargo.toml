[workspace]
resolver = "2"
members = [
    "crates/flowdictate-core",
    "crates/flowdictate-audio",
    "crates/flowdictate-asr",
    "crates/flowdictate-refine",
    "crates/flowdictate-inject",
    "crates/flowdictate-storage",
    "crates/flowdictate-security",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flowdictate/flowdictate"
description = "Privacy-first local voice computing input layer"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging (NEVER log transcripts, audio, or secrets)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Security primitives
sha2 = "0.10"
zeroize = { version = "1.9", features = ["derive"] }
hex = "0.4"

# Inter-thread communication
crossbeam-channel = "0.5"

# Audio
cpal = "0.15"
ringbuf = "0.4"
rubato = "0.16"
hound = "3.5"

# VAD
webrtc-vad = "0.4"

# ASR — whisper.cpp bindings
whisper-rs = "0.13"

# LLM refinement — llama.cpp bindings (optional)
llama-cpp-2 = "0.1"

# Database — SQLCipher encrypted SQLite
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }

# OS credential storage
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Text injection
enigo = "0.2"

# Global hotkey
global-hotkey = "0.6"

# Tauri v2
tauri = { version = "2", features = [] }
tauri-build = "2"

# NOTE: No HTTP client (reqwest, hyper, curl) is included.
# NOTE: No analytics, telemetry, or advertising SDK is included.
# NOTE: No async runtime (tokio) is included — dedicated threads + crossbeam instead.

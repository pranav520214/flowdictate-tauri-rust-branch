<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowDictate Settings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #18181b; color: #e4e4e7; padding: 24px;
        }
        h1 { font-size: 20px; margin-bottom: 24px; font-weight: 600; }
        h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
             color: #71717a; margin: 24px 0 12px; }
        .dashboard { background: #27272a; border-radius: 8px; padding: 16px; }
        .row { display: flex; justify-content: space-between; padding: 8px 0;
               border-bottom: 1px solid #3f3f46; }
        .row:last-child { border-bottom: none; }
        .label { color: #a1a1aa; font-size: 13px; }
        .value { font-size: 13px; font-weight: 500; }
        .value.good { color: #22c55e; }
        .value.neutral { color: #e4e4e7; }
        .value.warn { color: #f59e0b; }
    </style>
</head>
<body>
    <h1>FlowDictate Settings</h1>

    <h2>Privacy Status</h2>
    <div class="dashboard" id="privacy-dashboard">
        <div class="row">
            <span class="label">Network Access</span>
            <span class="value good" id="network">NONE</span>
        </div>
        <div class="row">
            <span class="label">Cloud Processing</span>
            <span class="value good" id="cloud">NONE</span>
        </div>
        <div class="row">
            <span class="label">Telemetry</span>
            <span class="value good" id="telemetry">OFF / NOT PRESENT</span>
        </div>
        <div class="row">
            <span class="label">Audio Storage</span>
            <span class="value good" id="audio-storage">OFF</span>
        </div>
        <div class="row">
            <span class="label">History</span>
            <span class="value neutral" id="history">Session Only</span>
        </div>
        <div class="row">
            <span class="label">Context Access</span>
            <span class="value good" id="context">None (Level 0)</span>
        </div>
        <div class="row">
            <span class="label">Personalization</span>
            <span class="value neutral" id="personalization">Enabled</span>
        </div>
        <div class="row">
            <span class="label">Model</span>
            <span class="value neutral" id="model">Not loaded</span>
        </div>
        <div class="row">
            <span class="label">Database</span>
            <span class="value good" id="database">ENCRYPTED</span>
        </div>
    </div>

        //     const data = await invoke('get_privacy_dashboard');
        //     // Update DOM with actual values
        // }
        // loadDashboard();
    </script>
</body>
</html>
